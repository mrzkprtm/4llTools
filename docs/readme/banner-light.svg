<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="4llTools: 200 free tools and simulations that run in your browser">
<style>
  .t { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1a17; }
  .m { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #676357; letter-spacing: 0.08em; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes swing { 0%, 100% { transform: rotate(26deg); } 50% { transform: rotate(-26deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin2 { to { transform: rotate(-360deg); } }
  @keyframes scroll { to { transform: translateX(-120px); } }
  @keyframes bar { 0%, 100% { transform: scaleY(var(--a)); } 50% { transform: scaleY(var(--b)); } }
  @keyframes pop { 0%, 100% { transform: scale(0.6); opacity: 0.35; } 50% { transform: scale(1); opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  .rise { animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .pend { transform-origin: 900px 72px; animation: swing 2.4s ease-in-out infinite; }
  .orbit { transform-origin: 1148px 150px; animation: spin 6s linear infinite; }
  .moon { transform-origin: 1148px 150px; animation: spin2 2.6s linear infinite; }
  .wave { animation: scroll 1.6s linear infinite; }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: bar 1.8s ease-in-out infinite; }
  .dot { transform-box: fill-box; transform-origin: center; animation: pop 2s ease-in-out infinite; }
  .caret { animation: blink 1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d8d2c3" stroke-width="1" opacity="0.55"/></pattern>
  <clipPath id="waveclip"><rect x="836" y="236" width="224" height="124" rx="10"/></clipPath>
</defs>
<rect width="1280" height="400" rx="20" fill="#f3f0e8"/>
<rect width="1280" height="400" rx="20" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="1279" height="399" rx="19.5" fill="none" stroke="#d8d2c3"/>

<g class="rise"><text x="64" y="92" class="m" font-size="15">A POCKET WORKBENCH · 200 TOOLS</text></g>
<g class="rise" style="animation-delay: 80ms"><text x="60" y="176" class="t" font-size="96" font-weight="800" letter-spacing="-4"><tspan fill="#c2410c">4</tspan>ll<tspan font-weight="400">Tools</tspan><tspan class="caret" fill="#c2410c" font-weight="400">_</tspan></text></g>
<g class="rise" style="animation-delay: 160ms">
  <text x="64" y="232" class="t" font-size="27" font-weight="650">Small tools for everyday jobs.</text>
  <text x="64" y="268" class="t" font-size="27" font-weight="400" fill="#676357" style="fill: #676357">Nothing you type leaves this tab.</text>
</g>
<g class="rise" style="animation-delay: 240ms" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <g transform="translate(64 306)"><rect width="157" height="34" rx="17" fill="#fcfbf7" stroke="#d8d2c3"/><text x="14" y="22" fill="#1b1a17">100 simulations</text></g>
  <g transform="translate(236 306)"><rect width="182.79999999999998" height="34" rx="17" fill="#fcfbf7" stroke="#d8d2c3"/><text x="14" y="22" fill="#1b1a17">100 everyday tools</text></g>
  <g transform="translate(428 306)"><rect width="217.2" height="34" rx="17" fill="#fcfbf7" stroke="#d8d2c3"/><text x="14" y="22" fill="#1b1a17">0 uploads · 0 sign-ups</text></g>
</g>

<!-- Pendulum -->
<g>
  <rect x="836" y="40" width="224" height="180" rx="10" fill="#fcfbf7" stroke="#d8d2c3"/>
  <text x="850" y="208" class="m" font-size="11">PHYSICS</text>
  <rect x="870" y="64" width="60" height="8" rx="2" fill="#1b1a17"/>
  <path d="M858 162 A 42 42 0 0 0 942 162" fill="none" stroke="#d8d2c3" stroke-dasharray="3 5" transform="translate(0 0)"/>
  <g class="pend"><line x1="900" y1="72" x2="900" y2="172" stroke="#1b1a17" stroke-width="2.5"/><circle cx="900" cy="172" r="13" fill="#c2410c" stroke="#fcfbf7" stroke-width="3"/></g>
  <circle cx="900" cy="72" r="4" fill="#fcfbf7" stroke="#1b1a17" stroke-width="2"/>
</g>

<!-- Orbit -->
<g>
  <rect x="1076" y="40" width="152" height="180" rx="10" fill="#0d0c0b" stroke="#d8d2c3"/>
  <text x="1090" y="208" class="m" font-size="11" style="fill:#a39d8f">SPACE</text>
