  <circle cx="1148" cy="150" r="12" fill="#f59f00"/><circle cx="1148" cy="150" r="20" fill="#f59f00" opacity="0.18"/>
  <g class="orbit"><circle cx="1194" cy="150" r="6" fill="#4dabf7"/><g class="moon" style="transform-origin: 1194px 150px"><circle cx="1206" cy="150" r="2.5" fill="#efebe2"/></g></g>
  <circle class="dot" style="animation-delay:0s" cx="1092" cy="60" r="1.4" fill="#efebe2"/><circle class="dot" style="animation-delay:0.3s" cx="1210" cy="76" r="1.4" fill="#efebe2"/><circle class="dot" style="animation-delay:0.6s" cx="1100" cy="120" r="1.4" fill="#efebe2"/><circle class="dot" style="animation-delay:0.8999999999999999s" cx="1214" cy="196" r="1.4" fill="#efebe2"/><circle class="dot" style="animation-delay:1.2s" cx="1130" cy="70" r="1.4" fill="#efebe2"/><circle class="dot" style="animation-delay:1.5s" cx="1180" cy="190" r="1.4" fill="#efebe2"/>
</g>

